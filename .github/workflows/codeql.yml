name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '30 22 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Debug is deliberate: release variants need the gitignored signing keystore, and CodeQL
      # reads unminified bytecode anyway, so there is nothing to gain from R8 here.
      - name: Build GithubDebug variant
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
